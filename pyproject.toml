[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-factor-research-lab"
version = "1.0.0"
description = "Reproducible equity factor research with synthetic data and chronological model evaluation."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
